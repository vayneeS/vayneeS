<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vaynee Sungeelee, human-AI interaction, data analyst, assistive technology. Illustration: an AI proposes three recommendations, the person chooses one, and feedback flows back to the AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1210"/><stop offset="1" stop-color="#10201a"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2ee59d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#2ee59d" stroke-opacity="0.25"/>

  <text x="40" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#2ee59d">HUMAN–AI INTERACTION · DATA ANALYST · ASSISTIVE TECHNOLOGY</text>
  <text x="40" y="202" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Vaynee Sungeelee</text>

  <!-- person -->
  <circle cx="740" cy="140" r="16" fill="none" stroke="#2ee59d" stroke-width="1.8"/>
  <path d="M708 205 a32 32 0 0 1 64 0" fill="none" stroke="#2ee59d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="740" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#7f958b">PERSON</text>

  <!-- recommendations -->
  <rect x="860" y="100" width="140" height="38" rx="8" fill="none" stroke="#2ee59d" stroke-opacity="0.3" stroke-width="1.3"/>
  <rect x="874" y="111" width="78" height="5" rx="2.5" fill="#2f4a3f"/>
  <rect x="874" y="122" width="54" height="5" rx="2.5" fill="#2f4a3f"/>
  <rect x="860" y="146" width="140" height="38" rx="8" fill="#2ee59d" fill-opacity="0.12" stroke="#2ee59d" stroke-width="1.6"/>
  <rect x="874" y="157" width="78" height="5" rx="2.5" fill="#2ee59d" fill-opacity="0.8"/>
  <rect x="874" y="168" width="54" height="5" rx="2.5" fill="#2ee59d" fill-opacity="0.5"/>
  <circle cx="982" cy="165" r="9" fill="#2ee59d"/>
  <path d="M977.5 165.5 l3.2 3.2 l6 -6.4" fill="none" stroke="#0b1210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="860" y="192" width="140" height="38" rx="8" fill="none" stroke="#2ee59d" stroke-opacity="0.3" stroke-width="1.3"/>
  <rect x="874" y="203" width="78" height="5" rx="2.5" fill="#2f4a3f"/>
  <rect x="874" y="214" width="54" height="5" rx="2.5" fill="#2f4a3f"/>

  <!-- person chooses -->
  <line x1="782" y1="165" x2="854" y2="165" stroke="#2ee59d" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- AI -->
  <rect x="1092" y="137" width="56" height="56" rx="12" fill="none" stroke="#2ee59d" stroke-width="1.8"/>
  <line x1="1106" y1="153" x2="1134" y2="153" stroke="#2ee59d" stroke-opacity="0.6" stroke-width="1.4"/>
  <line x1="1106" y1="153" x2="1120" y2="179" stroke="#2ee59d" stroke-opacity="0.6" stroke-width="1.4"/>
  <line x1="1134" y1="153" x2="1120" y2="179" stroke="#2ee59d" stroke-opacity="0.6" stroke-width="1.4"/>
  <circle cx="1106" cy="153" r="3.5" fill="#2ee59d"/><circle cx="1134" cy="153" r="3.5" fill="#2ee59d"/><circle cx="1120" cy="179" r="3.5" fill="#2ee59d"/>
  <text x="1120" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#7f958b">AI</text>

  <!-- AI proposes -->
  <line x1="1088" y1="160" x2="1006" y2="121" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="1.3" marker-end="url(#ahd)"/>
  <line x1="1088" y1="165" x2="1006" y2="165" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="1.3" marker-end="url(#ahd)"/>
  <line x1="1088" y1="170" x2="1006" y2="211" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="1.3" marker-end="url(#ahd)"/>

  <!-- feedback loop -->
  <path d="M740 244 C 800 300, 1060 300, 1120 244" fill="none" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ahd)"/>
  <text x="930" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#7f958b">FEEDBACK</text>

</svg>